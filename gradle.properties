## Mod Properties

mod_id=cbmultipart_chunkfix
mod_name=CBMultipart Chunk Scheduler Fix
# No upstream license applies (this is new, standalone code, not a fork) - MIT.
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.malik.cbmultipartchunkfix

# CBMultipart: version actually deployed on the server (server-mod-sync.md). Server-side only -
# the bug (WorldTickScheduler$ChunkScheduler.onChunkLoad throwing "Chunk already loaded?" on a
# stale scheduler reference left behind when a scheduler finishes ticking before its chunk
# unloads - see https://github.com/TheCBProject/CBMultipart/issues/197) is pure server chunk-load
# logic, nothing client-visible depends on it.
cb_multipart_version=3.5.0.155

# Compile-time dependency coordinates (never shipped - see build.gradle):
# CBMultipart 3.5.0.155 / CodeChickenLib 4.6.1.529 (NeoForge 1.21.1) from Modrinth's maven, by version id.
cb_multipart_modrinth_version=mhteXGK9
codechicken_lib_modrinth_version=vLDGhjNJ

